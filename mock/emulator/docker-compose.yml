# Local Azure Event Hubs emulator for the mock (TEMPORARY, like the rest of mock/).
# Hubs: match-events and match-tracking, 4 partitions each; consumer groups $Default, stats, relay, archiver.
#
# The emulator only starts if you accept Microsoft's licence terms yourself:
#   https://github.com/Azure/azure-event-hubs-emulator-installer  (read the EULA there)
# then run, from this folder:
#   ACCEPT_EULA=Y docker compose up -d          (PowerShell: $env:ACCEPT_EULA="Y"; docker compose up -d)
services:
  emulator:
    container_name: overlap-eventhubs-emulator
    image: mcr.microsoft.com/azure-messaging/eventhubs-emulator:latest
    volumes:
      - ./Config.json:/Eventhubs_Emulator/ConfigFiles/Config.json
    ports:
      - "5672:5672"   # AMQP (what the SDK uses)
      - "9092:9092"   # Kafka endpoint
      - "5300:5300"   # health check
    environment:
      BLOB_SERVER: azurite
      METADATA_SERVER: azurite
      ACCEPT_EULA: ${ACCEPT_EULA:-N}
    depends_on:
      - azurite
    networks:
      eh-emulator:
        aliases:
          - eventhubs-emulator
  azurite:
    container_name: overlap-azurite
    image: mcr.microsoft.com/azure-storage/azurite:latest
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    networks:
      eh-emulator:
        aliases:
          - azurite
networks:
  eh-emulator:
