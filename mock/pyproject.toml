[project]
name = "overlap-mock"
version = "0.1.0"
description = "TEMPORARY mock of the generator's live output. Delete when generator/live.py lands."
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9",
    "azure-eventhub>=5.11",
    "azure-identity>=1.15",
]

[project.scripts]
mock = "overlap_mock.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["overlap_mock"]
