# Web app checks: lint, typecheck and build, once web/package.json exists. Until then the job passes with a notice.
name: Web

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: web-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (lint, typecheck, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: d
        working-directory: .
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if ! git diff --name-only "${BASE}...${HEAD}" | grep -q '^web/'; then
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "::notice::web/ not changed; skipping."
          elif [ ! -f web/package.json ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "::notice::web/package.json doesn't exist yet; skipping."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.d.outputs.run == 'true'
        with:
          node-version: 22
      - name: Install
        if: steps.d.outputs.run == 'true'
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - name: Lint
        if: steps.d.outputs.run == 'true'
        run: npm run lint --if-present
      - name: Typecheck
        if: steps.d.outputs.run == 'true'
        run: |
          if [ -f tsconfig.json ]; then npx --no-install tsc --noEmit; else echo "No tsconfig.json"; fi
      - name: Build
        if: steps.d.outputs.run == 'true'
        run: npm run build --if-present
