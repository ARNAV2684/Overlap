[project]
name = "overlap-agents"
version = "0.1.0"
description = "Overlap insight agents: seven roles on stats moments, Microsoft Agent Framework, local first then Azure Foundry."
requires-python = ">=3.12,<3.13"
dependencies = [
    "agent-framework-core==1.22.0",
    "agent-framework-openai==1.17.0",
    "azure-identity==1.26.0",
    "azure-ai-translation-text==1.0.1",
    "azure-cosmos==4.17.1",
    "aiohttp==3.14.5",
    "mcp==1.30.0",
    "azure-messaging-webpubsubservice==1.3.0",
    "pydantic>=2,<3",
    # tracing to Application Insights and the optional Content Safety screen (agents/specs/observability.md)
    "opentelemetry-sdk==1.45.1",
    "azure-monitor-opentelemetry-exporter==1.0.0b58",
    "azure-ai-contentsafety==1.0.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff==0.17.0"]
# only for evals/foundry_quality.py (uv sync --group foundry-evals); never installed on the Functions app
foundry-evals = ["azure-ai-evaluation==1.18.10"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
required-version = ">=0.13.4"   # one uv for everyone: the lockfile format follows the uv version
package = false

[tool.ruff]
line-length = 120
