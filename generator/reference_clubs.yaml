# reference_clubs.yaml — Hand-authored reference clubs
#
# Purpose: the reference profiles: invented names, with style and attributes hand-set to resemble real teams
# Inputs:  -
# Outputs: read by world.py
# Spec:    generator/specs/world.md
#
# Every name, venue and city here is invented. Never write the real team or player a profile is modelled on in this
# file. Ratings are set by hand (CONTRIBUTING.md, "Reference profiles are allowed"). Only the football resembles the
# real team: colours, shirt numbers, player names and feet follow world.md §1-§6 and point at nobody.
#
# Players: `role` is required (allowed roles per position: specs/world.md §3). `other` (secondary positions)
#          defaults to none, `preferred_foot` to right, `weak_foot` to 3.
# `attr` order: pace, passing, dribbling, finishing, tackling, stamina,
#               acceleration, vision, positioning, aerial, composure, goalkeeping
# `default_xi`: shirt numbers in the formation's slot order, goalkeeper first.
# `set_pieces`: ordered taker shirt numbers for penalties, corners and direct free kicks.

