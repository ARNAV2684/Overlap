# league_clubs.yaml — League club templates
#
# Purpose: the 8 league clubs: invented identities, with formation, style, target strength and squad shape hand-set
#          to resemble real clubs; their players are generated from the season seed (world.py)
# Inputs:  -
# Outputs: read by world.py
# Spec:    generator/specs/world.md §1-§6
#
# Every name, id, city, venue and colour here is invented and points at nobody. Never write the real club a template
# is modelled on in this file; that lives only in the private file (CONTRIBUTING.md, "Reference profiles are allowed").
# A change here changes the world: bump world_version in reference_clubs.yaml.
#
# `level`: the target strength (mean overall of the default XI, world.md §4).
# `shape`: players per primary position, 25 in total with 3 goalkeepers; every formation slot needs 2 or more.
# `roles`: the roles drawn for a position, in turn; a position not listed draws from every allowed role.

clubs:
  - team_id: KES
    name: Kestlebury United
    short_name: Kestlebury
    city: Kestlebury
    venue: {name: Hollin Lane, city: Kestlebury}
    colours:
      home: {primary: "#1F6B3A", secondary: "#F4F4F4"}
      away: {primary: "#F4F4F4", secondary: "#1F6B3A"}
    formation: 4-3-3
    level: 80
    style: {press_intensity: 0.85, directness: 0.45, width: 0.70, tempo: 0.75, line_height: 0.80, build_up_short: 0.70,
            counter_press: 0.90, press_height: 0.80, counter_attack: 0.70, set_piece_focus: 0.45}
    shape: {GK: 3, CB: 4, RB: 2, LB: 2, DM: 2, CM: 4, AM: 1, RW: 2, LW: 2, ST: 3}
    roles:
      GK: [sweeper_keeper, shot_stopper]
      CB: [ball_playing_cb, stopper]
      RB: [overlapping_fullback]
      LB: [overlapping_fullback]
      DM: [anchor, ball_winner]
      CM: [box_to_box, playmaker]
      RW: [inverted_winger]
      LW: [inverted_winger, wide_winger]
      ST: [pressing_forward, poacher]

