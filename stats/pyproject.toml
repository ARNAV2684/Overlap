[project]
name = "overlap-stats"
version = "0.1.0"
description = "Overlap stats engine: match events in; numbers, stat panels and evidence-backed moments out."
requires-python = ">=3.12"
dependencies = [
    "azure-cosmos>=4.7",
    "azure-storage-blob>=12.20",
    "azure-identity>=1.17",
    "azure-eventhub>=5.12",
    "azure-eventhub-checkpointstoreblob>=1.2",
]

[dependency-groups]
dev = ["pytest>=8", "aiohttp>=3.9"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
required-version = ">=0.13.4"   # one uv for everyone: the lockfile format follows the uv version
package = false

[tool.ruff]
line-length = 120
