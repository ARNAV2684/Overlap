[project]
name = "overlap-functions"
version = "0.1.0"
description = "Overlap Azure Functions: the screen relay, the archiver and the insight agents (with their MCP server)."
requires-python = ">=3.12,<3.13"
# Keep in step with requirements.txt, which the Azure Functions host installs. One environment for every function:
# the agents' and the MCP server's packages are pinned to the same versions as agents/ and mcp_server/.
dependencies = [
    "azure-functions>=1.21",
    "azure-cosmos==4.17.1",
    "azure-messaging-webpubsubservice==1.3.0",
    "azure-identity==1.26.0",
    "azure-eventhub>=5.12",
    "azure-eventhub-checkpointstoreblob>=1.2",
    "azure-storage-blob>=12.20",
    "aiohttp==3.14.5",
    "agent-framework-core==1.22.0",
    "agent-framework-openai==1.17.0",
    "azure-ai-translation-text==2.0.0",
    "mcp==1.30.0",
    "pydantic==2.14.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
required-version = ">=0.13.4"   # one uv for everyone: the lockfile format follows the uv version
package = false
